<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Spermüll Bonn</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Leaflet CSS for OpenStreetMap -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css" />
</head>
<body class="bg-light">
    <header class="bg-dark text-white py-4 fs-2 fw-semibold letter-spacing-1 text-center text-lg-start">Spermüll Bonn</header>

    <!-- Mode Switch Section -->
    <section class="container my-4">
        <div class="d-flex gap-3 justify-content-center">
            <button type="button" id="mode-location" class="btn btn-outline-primary active">Find by location</button>
            <button type="button" id="mode-date" class="btn btn-outline-primary">Find by date</button>
        </div>
    </section>

    <form class="container my-5 p-4 bg-white rounded shadow">
        <!-- Find by date fields -->
        <div id="date-fields" class="row g-3">
            <div class="col-md">
                <label for="date1" class="form-label fw-bold">Date 1</label>
                <input type="date" id="date1" name="date1" class="form-control" />
            </div>
            <div class="col-md">
                <label for="date2" class="form-label fw-bold">Date 2</label>
                <input type="date" id="date2" name="date2" class="form-control" />
            </div>
            <div class="col-md d-flex align-items-end">
                <button type="button" id="filter-btn" class="btn btn-primary w-100">Find location</button>
            </div>
        </div>
        <!-- Find by location fields -->
        <div id="location-fields" class="row g-3 mt-1">
            <div class="col-md">
                <label for="location" class="form-label fw-bold">Location</label>
                <input type="text" id="location" name="location" placeholder="Enter location" class="form-control" list="address-list" autocomplete="off" />
                <datalist id="address-list"></datalist>
            </div>
            <div class="col-md d-flex align-items-end">
                <button type="button" id="find-dates-btn" class="btn btn-secondary w-100">Find Dates</button>
            </div>
        </div>
    </form>
    <div id="next_dates" class="container my-4 fs-4 fw-semibold" style="display: none;"></div>
    <div id="map" class="container mb-5 rounded shadow" style="height: 600px; background: #e9ecef;"></div>
    <!-- Leaflet JS for OpenStreetMap -->
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="scripts.js"></script>
</body>
</html>
